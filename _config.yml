# Site Build Settings

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-scholar

# Keep archived writing in the repository, outside the single-page site.
exclude:
  - _posts
  - menu/blogs.md
  - menu/jottings.md
  - menu/moments.md
  - rss-feed.xml
  - build-website.sh

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           'Sihan Fu'
description:	       '只识弯弓射大雕'
author:              '付思瀚'

url: "https://vossera.github.io" # the base hostname & protocol for your site

scholar:
  style: "assets/acm-siggraph.csl"
# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml
