<div class="moment-item">
  <figure class="moment-image">
    <img src="{{ include.url | relative_url }}" alt="{{ include.description | default: include.text | escape }}" loading="lazy" decoding="async">
    {% if include.text %}
    <div class="moment-text">
      <p>{{ include.text }}</p>
      {% if include.date %}
      <div class="moment-date">{{ include.date }}</div>
      {% endif %}
    </div>
    {% endif %}
    {% if include.description and include.text == nil %}
    <figcaption class="moment-caption">
      {{ include.description }}
      {% if include.date %}
      <div class="moment-date">{{ include.date }}</div>
      {% endif %}
    </figcaption>
    {% endif %}
  </figure>
</div>
